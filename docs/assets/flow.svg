<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d">
<title id="t">How Deep research works</title>
<desc id="d">preflight (models, keys, cost) then init (a campaign folder) then Run a skill (search, read, quote) then check (quotes and completion). Campaigns stay in the plugin data folder. Paid calls need your key.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#475569"/></marker></defs>
<rect width="1200" height="270" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="40" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">How it works</text>
<rect x="40" y="60" width="250" height="120" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
<text x="56" y="108" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">preflight</text>
<text x="56" y="144" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#334155">models, keys, cost</text>
<line x1="294" y1="120" x2="326" y2="120" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="330" y="60" width="250" height="120" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
<text x="346" y="108" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">init</text>
<text x="346" y="144" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#334155">a campaign folder</text>
<line x1="584" y1="120" x2="616" y2="120" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="620" y="60" width="250" height="120" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
<text x="636" y="108" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Run a skill</text>
<text x="636" y="144" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#334155">search, read, quote</text>
<line x1="874" y1="120" x2="906" y2="120" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="910" y="60" width="250" height="120" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
<text x="926" y="108" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">check</text>
<text x="926" y="144" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#334155">quotes and completion</text>
<text x="40" y="240" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#475569">Campaigns stay in the plugin data folder. Paid calls need your key.</text>
</svg>
