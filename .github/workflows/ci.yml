name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Run offline tests
        env:
          PLAIN_WORDS_PATH: /dev/null
        run: python -m pytest skills/deep-research/scripts skills/deep-research-fast/scripts
      - run: git diff --check
