[project]
name = "hermes-deep-research"
version = "2.0.0"
description = "Hermes Agent plugin and skills for multi-lane, fast, and deepest research backed by saved sources and checked quotations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6,<7",
    "jsonschema>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false
